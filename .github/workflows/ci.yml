name: Desktop verification

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis,msi
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify project versions and release tooling
        run: |
          pnpm release:check
          pnpm release:test
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Select Rust toolchain
        run: rustup default 1.96.0
      - name: Frontend tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend formatting
        run: pnpm format:check
      - name: Frontend build
        run: pnpm build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests and synthetic migration export
        env:
          TIMEFOLIO_MIGRATION_OUTPUT: ${{ runner.temp }}/migration.timefolio.json
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Build installer without a developer certificate
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} '--' --locked
      - name: Keep synthetic migration data
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ matrix.target }}
          path: ${{ runner.temp }}/migration.timefolio.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  import-on-macos:
    name: Windows export to macOS restore and export
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migration-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/incoming
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Restore Windows export and reexport on macOS
        env:
          TIMEFOLIO_MIGRATION_INPUT: ${{ runner.temp }}/incoming/migration.timefolio.json
          TIMEFOLIO_MIGRATION_OUTPUT: ${{ runner.temp }}/migration.timefolio.json
        run: cargo +1.96.0 test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test portable_migration
      - uses: actions/upload-artifact@v4
        with:
          name: migration-windows-macos
          path: ${{ runner.temp }}/migration.timefolio.json
          if-no-files-found: error
          retention-days: 7

  return-to-windows:
    name: macOS reexport back to Windows
    needs: import-on-macos
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migration-windows-macos
          path: ${{ runner.temp }}/incoming
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify complete Windows to macOS to Windows roundtrip
        env:
          TIMEFOLIO_MIGRATION_INPUT: ${{ runner.temp }}/incoming/migration.timefolio.json
        run: cargo +1.96.0 test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test portable_migration
