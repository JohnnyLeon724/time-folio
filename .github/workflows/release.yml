name: Release draft

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo 'Run this workflow on an existing version tag, not a branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag, versions, identity and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.mjs check "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: installers
      - name: Stage installers and SHA-256 checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' windows < <(find installers/unsigned-x86_64-pc-windows-msvc -type f -name '*.exe' -print0)
          mapfile -d '' msi < <(find installers/unsigned-x86_64-pc-windows-msvc -type f -name '*.msi' -print0)
          mapfile -d '' macos < <(find installers/unsigned-aarch64-apple-darwin -type f -name '*.dmg' -print0)
          mapfile -d '' intel < <(find installers/unsigned-x86_64-apple-darwin -type f -name '*.dmg' -print0)
          if [ "${#windows[@]}" -ne 1 ] || [ "${#msi[@]}" -ne 1 ] || [ "${#macos[@]}" -ne 1 ] || [ "${#intel[@]}" -ne 1 ]; then
            echo 'Expected one NSIS installer, one MSI and one DMG per Mac architecture.' >&2
            exit 1
          fi
          mkdir release-files
          cp "${windows[0]}" "release-files/Timefolio_${VERSION}_windows_x64_setup.exe"
          cp "${msi[0]}" "release-files/Timefolio_${VERSION}_windows_x64.msi"
          cp "${macos[0]}" "release-files/Timefolio_${VERSION}_macos_arm64.dmg"
          cp "${intel[0]}" "release-files/Timefolio_${VERSION}_macos_x64.dmg"
          cd release-files
          sha256sum *.exe *.msi *.dmg > SHA256SUMS.txt
      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo 'This release is already published; use a new version tag.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Timefolio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "Timefolio $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
